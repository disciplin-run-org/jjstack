name: Version Bump

# A release is a TAG on the merged commit, never a commit. Branch protection on
# main requires every change to arrive through a reviewed pull request with a
# passing `verify`, so a bot commit that bumps a VERSION file is refused. It was,
# on every merge from #41 onwards, and because the old step ran
# `git push origin main --tags` the tag landed while main was refused, leaving
# v0.42.1 and v0.43.0 on commits that never reached main. Tags are not branches
# and protection does not cover them, so pushing only the tag needs no bypass.
#
# The version logic lives in bin/jjstack-release-version, where test/smoke.sh
# runs it, instead of inline here where nothing does.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# One release at a time: two merges close together must not both count from
# the same highest tag and race for the same number.
concurrency:
  group: version-bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag the release
        run: |
          NEW="$(bash bin/jjstack-release-version .)"
          if [ -z "$NEW" ]; then
            echo "nothing to release"
            exit 0
          fi
          git tag "$NEW" HEAD
          git push origin "refs/tags/$NEW"
          echo "released $NEW"
